# Template only; not part of kustomization.yaml so real tokens are never committed.
# Create the real secret with:
#   kubectl -n context-builder create secret generic context-builder-secrets \
#     --from-literal=WAZUH_GATEWAY_INTERNAL_TOKEN='<gateway token>' \
#     --from-literal=CONTEXT_BUILDER_INTERNAL_TOKEN="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: context-builder-secrets
  namespace: context-builder
type: Opaque
stringData:
  WAZUH_GATEWAY_INTERNAL_TOKEN: "<gateway token>"
  CONTEXT_BUILDER_INTERNAL_TOKEN: "<token clients must send>"
