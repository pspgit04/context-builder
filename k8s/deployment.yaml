apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-builder
  namespace: context-builder
  labels:
    app: context-builder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context-builder
  template:
    metadata:
      labels:
        app: context-builder
    spec:
      serviceAccountName: context-builder
      containers:
        - name: context-builder
          image: localhost/context-builder:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: context-builder-config
            - secretRef:
                name: context-builder-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
