apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-builder
  namespace: context-builder
  labels:
    app: context-builder
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-reports-reader
  labels:
    app: context-builder
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: context-builder-trivy-reader
  labels:
    app: context-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-reports-reader
subjects:
  - kind: ServiceAccount
    name: context-builder
    namespace: context-builder
